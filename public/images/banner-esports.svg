<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="neonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0b1b36" />
      <stop offset="100%" stop-color="#04121a" />
    </linearGradient>
    <linearGradient id="greenCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff87" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    <filter id="esportsGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#neonBg)" />

  <!-- Cyber Grid Lines -->
  <line x1="0" y1="360" x2="800" y2="360" stroke="#00ff87" stroke-width="2" opacity="0.4" />
  <line x1="0" y1="400" x2="800" y2="400" stroke="#00e5ff" stroke-width="2" opacity="0.3" />
  <line x1="400" y1="200" x2="0" y2="450" stroke="#00ff87" stroke-width="1.5" opacity="0.3" />
  <line x1="400" y1="200" x2="800" y2="450" stroke="#00e5ff" stroke-width="1.5" opacity="0.3" />
  <line x1="400" y1="200" x2="200" y2="450" stroke="#00ff87" stroke-width="1" opacity="0.3" />
  <line x1="400" y1="200" x2="600" y2="450" stroke="#00e5ff" stroke-width="1" opacity="0.3" />

  <!-- Giant Screen Stage Mockup -->
  <polygon points="120,60 680,60 740,260 60,260" fill="#030814" stroke="url(#greenCyan)" stroke-width="3" filter="url(#esportsGlow)" opacity="0.9" />
  
  <!-- Screen Content: Football & Controller -->
  <!-- Soccer Ball Wireframe on Screen -->
  <circle cx="400" cy="160" r="55" fill="#081426" stroke="#00ff87" stroke-width="4" />
  <polygon points="400,135 422,152 414,178 386,178 378,152" fill="#00ff87" />
  <line x1="400" y1="135" x2="400" y2="105" stroke="#00e5ff" stroke-width="3" />
  <line x1="422" y1="152" x2="450" y2="142" stroke="#00e5ff" stroke-width="3" />
  <line x1="414" y1="178" x2="435" y2="202" stroke="#00e5ff" stroke-width="3" />
  <line x1="386" y1="178" x2="365" y2="202" stroke="#00e5ff" stroke-width="3" />
  <line x1="378" y1="152" x2="350" y2="142" stroke="#00e5ff" stroke-width="3" />

  <!-- VS Text on Sides -->
  <text x="240" y="170" font-family="system-ui, sans-serif" font-size="36" font-weight="900" fill="#00e5ff" text-anchor="middle" letter-spacing="4">HOME</text>
  <text x="560" y="170" font-family="system-ui, sans-serif" font-size="36" font-weight="900" fill="#00ff87" text-anchor="middle" letter-spacing="4">AWAY</text>

  <!-- Banner Top Header -->
  <rect x="250" y="15" width="300" height="42" rx="10" fill="#020712" stroke="url(#greenCyan)" stroke-width="2" />
  <text x="400" y="42" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">
    eSPORTS PRO LEAGUE
  </text>
</svg>
