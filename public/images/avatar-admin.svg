<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="50%" stop-color="#05101e" />
      <stop offset="100%" stop-color="#020814" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0c296" />
      <stop offset="100%" stop-color="#d69f6e" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a221f" />
      <stop offset="100%" stop-color="#120e0d" />
    </linearGradient>
    <linearGradient id="jerseyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2338" />
      <stop offset="100%" stop-color="#071320" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="256" height="256" rx="48" fill="url(#bgGrad)" />
  <circle cx="128" cy="128" r="110" fill="none" stroke="url(#accentGlow)" stroke-width="3" opacity="0.4" />
  
  <!-- Aura glow behind head -->
  <circle cx="128" cy="115" r="70" fill="url(#accentGlow)" opacity="0.15" filter="url(#glow)" />

  <!-- Body / Jersey -->
  <path d="M48 238 C52 195, 78 175, 102 168 L114 190 L142 190 L154 168 C178 175, 204 195, 208 238 Z" fill="url(#jerseyGrad)" />
  <path d="M48 238 C52 195, 78 175, 102 168 L114 190 L142 190 L154 168 C178 175, 204 195, 208 238 Z" fill="none" stroke="url(#accentGlow)" stroke-width="2" opacity="0.6" />
  
  <!-- Jersey Neon Collar Stripes -->
  <path d="M102 168 L128 200 L154 168" fill="none" stroke="url(#accentGlow)" stroke-width="4" stroke-linecap="round" />
  
  <!-- Number 10 / Badge -->
  <circle cx="128" cy="222" r="14" fill="#030b14" stroke="#00ff87" stroke-width="1.5" />
  <text x="128" y="227" font-family="monospace, sans-serif" font-size="12" font-weight="900" fill="#00ff87" text-anchor="middle">10</text>

  <!-- Neck -->
  <path d="M112 145 L112 175 C112 182, 144 182, 144 175 L144 145 Z" fill="url(#skinGrad)" />

  <!-- Head Base -->
  <ellipse cx="128" cy="120" rx="42" ry="48" fill="url(#skinGrad)" />

  <!-- Ears -->
  <circle cx="84" cy="122" r="9" fill="url(#skinGrad)" />
  <circle cx="172" cy="122" r="9" fill="url(#skinGrad)" />

  <!-- Hair / Styled fade -->
  <path d="M84 105 C84 75, 95 55, 128 55 C161 55, 172 75, 172 105 C165 92, 155 88, 140 88 C125 88, 105 84, 92 100 C87 105, 85 108, 84 105 Z" fill="url(#hairGrad)" />

  <!-- Eyes -->
  <ellipse cx="112" cy="118" rx="5" ry="3.5" fill="#151b22" />
  <ellipse cx="144" cy="118" rx="5" ry="3.5" fill="#151b22" />
  <circle cx="113.5" cy="117" r="1.5" fill="#ffffff" />
  <circle cx="145.5" cy="117" r="1.5" fill="#ffffff" />

  <!-- Eyebrows -->
  <path d="M104 110 Q112 107 120 110" fill="none" stroke="#221815" stroke-width="2.5" stroke-linecap="round" />
  <path d="M136 110 Q144 107 152 110" fill="none" stroke="#221815" stroke-width="2.5" stroke-linecap="round" />

  <!-- Nose -->
  <path d="M128 118 L126 128 L130 130" fill="none" stroke="#be8657" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Confident Smile -->
  <path d="M118 142 Q128 148 138 142" fill="none" stroke="#a0633b" stroke-width="2.5" stroke-linecap="round" />

  <!-- Esports Headset / Captain Crown Accent -->
  <path d="M82 110 C80 80, 100 62, 128 62 C156 62, 176 80, 174 110" fill="none" stroke="url(#accentGlow)" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
  <rect x="76" y="112" width="10" height="20" rx="5" fill="#030b14" stroke="#00ff87" stroke-width="2" />
  <rect x="170" y="112" width="10" height="20" rx="5" fill="#030b14" stroke="#00ff87" stroke-width="2" />
</svg>
