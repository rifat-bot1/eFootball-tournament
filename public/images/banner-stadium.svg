<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020612" />
      <stop offset="50%" stop-color="#0a1936" />
      <stop offset="100%" stop-color="#04282a" />
    </linearGradient>
    <linearGradient id="pitchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#044d2d" />
      <stop offset="30%" stop-color="#076939" />
      <stop offset="70%" stop-color="#058042" />
      <stop offset="100%" stop-color="#034526" />
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff87" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00ff87" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="cyanBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0" />
    </linearGradient>
    <filter id="bloom">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="450" fill="url(#skyGrad)" />

  <!-- Stadium Floodlight Beams -->
  <polygon points="120,40 0,380 260,380" fill="url(#beam)" opacity="0.25" />
  <polygon points="680,40 540,380 800,380" fill="url(#cyanBeam)" opacity="0.25" />
  <polygon points="400,20 220,380 580,380" fill="url(#beam)" opacity="0.2" />

  <!-- Stadium Stands / Crowd silhouettes -->
  <path d="M0 260 Q400 230 800 260 L800 320 Q400 290 0 320 Z" fill="#081426" opacity="0.8" />
  <path d="M0 280 Q400 250 800 280 L800 330 Q400 300 0 330 Z" fill="#0c1f3d" opacity="0.6" />
  
  <!-- Crowd Light Flashes -->
  <circle cx="150" cy="275" r="2" fill="#ffffff" opacity="0.8" />
  <circle cx="280" cy="265" r="2" fill="#00ff87" opacity="0.9" />
  <circle cx="520" cy="268" r="2.5" fill="#00e5ff" opacity="0.9" />
  <circle cx="670" cy="278" r="2" fill="#ffffff" opacity="0.7" />
  <circle cx="390" cy="260" r="3" fill="#ffdd59" opacity="0.8" />

  <!-- Pitch (3D Perspective) -->
  <polygon points="0,450 140,290 660,290 800,450" fill="url(#pitchGrad)" />
  
  <!-- Grass Cut Stripes -->
  <polygon points="160,290 220,290 140,450 60,450" fill="#055e34" opacity="0.4" />
  <polygon points="280,290 340,290 300,450 220,450" fill="#055e34" opacity="0.4" />
  <polygon points="400,290 460,290 460,450 380,450" fill="#055e34" opacity="0.4" />
  <polygon points="520,290 580,290 620,450 540,450" fill="#055e34" opacity="0.4" />

  <!-- White Pitch Markings (Perspective) -->
  <!-- Outer line -->
  <polygon points="145,295 655,295 780,440 20,440" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.85" />
  <!-- Center line -->
  <line x1="400" y1="295" x2="400" y2="440" stroke="#ffffff" stroke-width="3" opacity="0.85" />
  <!-- Center circle -->
  <ellipse cx="400" cy="365" rx="110" ry="32" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.85" />
  <circle cx="400" cy="365" r="4" fill="#ffffff" />
  <!-- Penalty box (far) -->
  <polygon points="310,295 490,295 510,335 290,335" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.85" />

  <!-- Floodlight Towers -->
  <circle cx="120" cy="40" r="14" fill="#ffffff" filter="url(#bloom)" />
  <circle cx="680" cy="40" r="14" fill="#60efff" filter="url(#bloom)" />
  <circle cx="120" cy="40" r="6" fill="#ffffff" />
  <circle cx="680" cy="40" r="6" fill="#ffffff" />

  <!-- Glowing Title / Brand Badge Overlay -->
  <g filter="url(#bloom)">
    <rect x="230" y="80" width="340" height="64" rx="16" fill="#030a16" fill-opacity="0.85" stroke="#00ff87" stroke-width="2" />
    <text x="400" y="112" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">
      eFOOTBALL ARENA
    </text>
    <text x="400" y="132" font-family="monospace, sans-serif" font-size="11" font-weight="bold" fill="#00ff87" text-anchor="middle" letter-spacing="4">
      OFFICIAL TOURNAMENT PITCH
    </text>
  </g>
</svg>
