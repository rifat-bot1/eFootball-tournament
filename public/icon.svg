<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF87" />
      <stop offset="100%" stop-color="#60EFFF" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="url(#neonGlow)" stroke-width="6" opacity="0.4" />
  
  <!-- Outer Hexagon Badge -->
  <polygon points="256,60 430,160 430,360 256,460 82,360 82,160" fill="#0f172a" stroke="url(#neonGlow)" stroke-width="12" filter="url(#glowEffect)" />
  
  <!-- Inner Football Pitch Lines -->
  <circle cx="256" cy="260" r="95" fill="none" stroke="#00FF87" stroke-width="8" opacity="0.85" />
  <line x1="161" y1="260" x2="351" y2="260" stroke="#00FF87" stroke-width="8" opacity="0.85" />
  <circle cx="256" cy="260" r="14" fill="#00FF87" />
  
  <!-- Trophy Overlay -->
  <path d="M196 170 H316 V220 C316 260 286 295 256 300 C226 295 196 260 196 220 Z" fill="#60EFFF" opacity="0.9" />
  <!-- Trophy handles -->
  <path d="M196 185 H170 C155 185 145 200 155 220 C165 240 185 245 196 245" fill="none" stroke="#60EFFF" stroke-width="8" stroke-linecap="round" />
  <path d="M316 185 H342 C357 185 367 200 357 220 C347 240 327 245 316 245" fill="none" stroke="#60EFFF" stroke-width="8" stroke-linecap="round" />
  <!-- Trophy stem & base -->
  <path d="M246 300 H266 V335 H246 Z" fill="#60EFFF" />
  <path d="M220 335 H292 V355 H220 Z" fill="#00FF87" rx="4" />
  
  <!-- Star accents -->
  <polygon points="256,115 262,130 278,132 266,143 270,158 256,149 242,158 246,143 234,132 250,130" fill="#00FF87" />
</svg>
